name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          echo "=== Java Environment Verification ==="
          java -version
          echo "JAVA_HOME: ${JAVA_HOME}"
          if [ -z "${JAVA_HOME}" ]; then
            echo "ERROR: JAVA_HOME is not set." >&2
            exit 1
          fi

          JAVA_VER_STR=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java version string: ${JAVA_VER_STR}"
          if [ -z "${JAVA_VER_STR}" ]; then
            echo "ERROR: Failed to detect Java version." >&2
            exit 1
          fi

          JAVA_MAJOR=$(echo "${JAVA_VER_STR}" | awk -F '.' '{print $1}')
          echo "Detected Java major version: ${JAVA_MAJOR}"

          if ! [[ "${JAVA_MAJOR}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Could not parse Java major version as a number: '${JAVA_MAJOR}'" >&2
            exit 1
          fi

          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "ERROR: Active Java major version is ${JAVA_MAJOR}, but 17 or newer is required." >&2
            exit 1
          fi
          echo "Java environment verified successfully: Java ${JAVA_MAJOR} (>= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create temporary debug keystore
        run: |
          echo "=== Debug Keystore Setup ==="
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists at ./debug.keystore"
          else
            echo "debug.keystore missing; generating temporary debug keystore..."
            "${JAVA_HOME}/bin/keytool" -genkeypair -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create or find ./debug.keystore" >&2
            exit 1
          fi
          echo "Temporary debug keystore confirmed ready."

      - name: Build debug APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        run: |
          echo "=== Verifying Debug APK Output ==="
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "${EXPECTED_APK}" ]; then
            echo "ERROR: Expected debug APK not found at: ${EXPECTED_APK}" >&2
            echo "Searching exclusively in app/build/outputs/apk directory:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "${EXPECTED_APK}" ]; then
            echo "ERROR: Expected debug APK at ${EXPECTED_APK} is an empty file." >&2
            exit 1
          fi

          if [[ "${EXPECTED_APK}" != *.apk ]]; then
            echo "ERROR: Expected file does not have .apk extension: ${EXPECTED_APK}" >&2
            exit 1
          fi

          APK_SIZE=$(stat -c%s "${EXPECTED_APK}" 2>/dev/null || stat -f%z "${EXPECTED_APK}" 2>/dev/null)
          echo "Verified APK: ${EXPECTED_APK} (${APK_SIZE} bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          echo "=== Preparing Release Asset ==="
          TEMP_ASSET_DIR="${{ runner.temp }}/release_asset"
          mkdir -p "${TEMP_ASSET_DIR}"

          REPO_NAME=$(echo "${{ github.repository }}" | awk -F'/' '{print $2}' | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          if [ -z "${REPO_NAME}" ]; then
            REPO_NAME="android-app"
          fi

          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          DEST_APK="${TEMP_ASSET_DIR}/${ASSET_NAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "${DEST_APK}"

          if [ ! -s "${DEST_APK}" ]; then
            echo "ERROR: Prepared release asset is missing or empty at ${DEST_APK}" >&2
            exit 1
          fi

          echo "Prepared release asset: ${DEST_APK} (filename: ${ASSET_NAME})"
          echo "asset_path=${DEST_APK}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Publishing to GitHub Releases ==="
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ -z "${ASSET_PATH}" ] || [ ! -s "${ASSET_PATH}" ] || [[ "${ASSET_PATH}" != *.apk ]]; then
            echo "ERROR: Invalid or missing APK release asset: ${ASSET_PATH}" >&2
            exit 1
          fi

          TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          ### Automated Debug APK Build

          - **Build Run Number:** #${{ github.run_number }}
          - **Run Attempt:** ${{ github.run_attempt }}
          - **Source Commit:** ${{ github.sha }}
          - **Builder:** GitHub Actions (Ubuntu runner)

          > **Note for Testers:**
          > This is an automatically generated debug APK built for testing purposes.
          > It is signed with a temporary debug keystore and is not intended for Google Play Store production distribution.
          EOF
          )

          echo "Creating GitHub Release with tag '${TAG}' and asset '${ASSET_PATH}'..."
          gh release create "${TAG}" "${ASSET_PATH}" \
            --title "${TITLE}" \
            --notes "${NOTES}" \
            --target "${{ github.sha }}" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Release and Artifact Outcome Report ==="
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"

          if [ "${RELEASE_OUTCOME}" = "success" ]; then
            TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
            TITLE="Debug APK Build #${{ github.run_number }}"
            RELEASE_URL=$(gh release view "${TAG}" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/${TAG}")
            ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

            echo "GitHub Release Published Successfully!"
            echo "Release Tag: ${TAG}"
            echo "Release Title: ${TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "Release APK Asset: ${ASSET_NAME}"

            echo "### 🚀 Debug APK Released Successfully!" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Page:** [${TITLE}](${RELEASE_URL})" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Download APK:** Download \`${ASSET_NAME}\` directly from the release **Assets** section on the release page." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Actions Artifact Backup:** The \`app-debug-apk\` artifact is also preserved and available under the Actions run summary." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing was not completed or encountered an issue. However, APK build and artifact upload succeeded."
            echo "### ⚠️ Debug APK Build Succeeded (Release Publishing Notice)" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Build Status:** Debug APK compiled successfully." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Artifact Available:** You can download \`app-debug-apk\` directly from this GitHub Actions run summary under **Artifacts**." >> "$GITHUB_STEP_SUMMARY"
            echo "- **Release Publishing:** Release publishing step did not complete or was skipped. Please verify repository GitHub Actions workflow write permissions if releases are desired." >> "$GITHUB_STEP_SUMMARY"
          fi
